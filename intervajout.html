<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>

<body>
    <div class="content">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <main class="main-content">
            
                <div class="form-card">
            
                    <div class="form-header">
                        <h2>
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                            Ajouter une intervention
                        </h2>
            
                        <p>
                            Enregistrez une nouvelle intervention informatique.
                        </p>
                    </div>
            
                    <form id="interventionForm">
            
                        <div class="form-grid">
            
                            <div class="form-group">
                                <label for="titre">Titre</label>
                                <input type="text" id="titre" placeholder="Ex : Remplacement du SSD">
                            </div>
            
                            <div class="form-group">
                                <label for="type">Type d'intervention</label>
                                <select id="type">
                                    <option>Maintenance</option>
                                    <option>Réparation</option>
                                    <option>Installation</option>
                                    <option>Configuration</option>
                                    <option>Mise à jour</option>
                                    
                                </select>
                            </div>
            
                            <div class="form-group">
                                <label for="equipement">Équipement concerné</label>
                                <input type="text" id="equipement">
                            </div>
            
                            <div class="form-group">
                                <label for="technicien">Technicien</label>
                                <input type="text" id="technicien" placeholder="Nom du technicien">
                            </div>
            
                            <div class="form-group">
                                <label for="utilisateur">Utilisateur concerné</label>
                                <input type="text" id="utilisateur" placeholder="Nom de l'utilisateur">
                            </div>
            
                            <div class="form-group">
                                <label for="departement">Département</label>
                                <select id="departement">
                                    <option>Informatique</option>
                                    <option>RH</option>
                                    <option>Comptabilité</option>
                                    <option>Commercial</option>
                                </select>
                            </div>
            
                            <div class="form-group">
                                <label for="urgence">Niveau d'urgence</label>
                                <select id="urgence">
                                    <option>Faible</option>
                                    <option>Moyenne</option>
                                    <option>Critique</option>
                                </select>
                            </div>
            
                            <div class="form-group">
                                <label for="statut">Statut</label>
                                <select id="statut">
                                    <option>En attente</option>
                                    <option>En cours</option>
                                    <option>Terminée</option>
                                </select>
                            </div>
            
                            <div class="form-group">
                                <label for="date">Date d'intervention</label>
                                <input type="date" id="date">
                            </div>
            
                            <div class="form-group">
                                <label for="duree">Durée estimée</label>
                                <input type="text" id="duree" placeholder="Ex : 2 heures">
                            </div>
            
                        </div>
            
                        <div class="form-group full-width">
                            <label for="probleme">Description du problème</label>
                            <textarea id="probleme" rows="5" placeholder="Décrivez le problème rencontré..."></textarea>
                        </div>
            
                        <div class="form-group full-width">
                            <label for="solution">Solution apportée</label>
                            <textarea id="solution" rows="5" placeholder="Décrivez la solution appliquée..."></textarea>
                        </div>
            
                        <div class="buttons">
            
                            <button type="reset" class="cancel">
                                Annuler
                            </button>
            
                            <button type="submit" class="save">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Enregistrer
                            </button>
            
                        </div>
            
                    </form>
            
                </div>
            
            </main>

        </main>

    </div>
    <script src="sidebar.js"></script>
    <script src="java.js"></script>
    <script src="interventions.js"></script>
    <script src="protection.js"></script>
</body>

</html>
