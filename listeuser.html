<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>

<body>
    <div class="content">
    <div id="sidebar-container"></div>
        <main class="main-content">
        
            <section class="welcome">
                <h1>Liste des utilisateurs</h1>
                <p>Consultez et gérez les utilisateurs du département informatique.</p>
            </section>
        
            <div class="table-card">
        
                <div class="table-header">
        
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchUser" placeholder="Rechercher un utilisateur...">
                    </div>
        
                    <div class="table-actions">
        
                        <select id="filterDepartement">
                            <option value="">Tous les départements</option>
                            <option>Informatique</option>
                            <option>RH</option>
                            <option>Comptabilité</option>
                            <option>Commercial</option>
                        </select>
        
                        <select id="filterStatut">
                            <option value="">Tous les statuts</option>
                            <option>Actif</option>
                            <option>Congé</option>
                            <option>Inactif</option>
                        </select>
        
                        <a href="utilisateur.html" class="add-btn">
                            <i class="fa-solid fa-user-plus"></i>
                            Ajouter un utilisateur
                        </a>
        
                    </div>
        
                </div>
        
                <table>
        
                    <thead>
        
                        <tr>
        
                            <th>Matricule</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Département</th>
                            <th>Poste</th>
                            <th>Email</th>
                            <th>Téléphone</th>
                            <th>Statut</th>
                            <th>Équipements</th>
                            <th>Actions</th>
        
                        </tr>
        
                    </thead>
        
                    <tbody id="usersTable">
        
                        <!-- Les utilisateurs seront ajoutés automatiquement -->
        
                    </tbody>
        
                </table>
        
                <div id="emptyMessage" class="empty">
        
                    <i class="fa-solid fa-users"></i>
        
                    <h3>Aucun utilisateur enregistré</h3>
        
                    <p>Ajoutez votre premier utilisateur.</p>
        
                </div>
        
            </div>
        
        </main>

    </div>
    <script src="sidebar.js"></script>
    <script src="java.js"></script>
    <script src="protection.js"></script>
    <script src="utilisateur.js"></script>
</body>

</html>
